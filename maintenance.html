<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Yunic Dining</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+SC:wght@500&family=Cormorant:ital,wght@0,400;1,400&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F7F7F4;
    --ink:#252420;
    --gold:#A48760;
    --gold-deep:#8A6D4B;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'DM Sans',sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    padding:24px;
    text-align:center;
  }
  .wrap{max-width:480px}
  .brand{
    font-family:'Cormorant SC',serif;
    font-size:1.4rem;
    letter-spacing:.16em;
    color:var(--ink);
    margin-bottom:32px;
  }
  .eyebrow{
    font-size:.72rem;
    letter-spacing:.38em;
    text-transform:uppercase;
    color:var(--gold-deep);
    margin-bottom:18px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:.8rem;
  }
  .eyebrow::before,.eyebrow::after{content:"";width:2.4rem;height:1px;background:var(--gold)}
  h1{
    font-family:'Cormorant',serif;
    font-style:italic;
    font-weight:400;
    font-size:clamp(1.8rem,4vw,2.4rem);
    color:var(--gold-deep);
    margin-bottom:20px;
    line-height:1.25;
  }
  p{
    font-size:1rem;
    line-height:1.7;
    color:var(--ink);
    opacity:.85;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="brand">YUNIC</div>
    <div class="eyebrow">Yunic Dining</div>
    <h1>We'll be right back.</h1>
    <p>We're currently making some updates behind the scenes. Thank you for your patience — please check back shortly.</p>
  </div>
</body>
</html>
